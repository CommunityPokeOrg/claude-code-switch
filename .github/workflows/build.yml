name: Build .nro

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make -j"$(nproc)"

      - name: Upload .nro artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-code-switch.nro
          path: claude-code-switch.nro
          if-no-files-found: error
